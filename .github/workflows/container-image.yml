# Source of truth: SCRIPTS/githubactions. Generated copies are overwritten.
name: Tests und Container
on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: New YYYY.M.N release version
        type: string
        required: true
concurrency:
  group: duengerrechner-release
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: npm ci
      - run: python -m venv .venv && .venv/bin/pip install -r requirements.txt
      - run: npm test
      - run: npm run worker:check
  image:
    needs: test
    timeout-minutes: 25
    env:
      IMAGE_TAG: ${{ inputs.image_tag }}
      DOCKER_BUILD_RECORD_UPLOAD: "false"
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
      - run: npm ci --omit=dev
      - name: Validate unused release version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$IMAGE_TAG" =~ ^[0-9]{4}\.([1-9]|1[0-2])\.[1-9][0-9]*$ ]]
          if tags="$(gh api --paginate 'users/safrano9999/packages/container/duengerrechner/versions?per_page=100' --jq '.[].metadata.container.tags[]' 2>/tmp/package-error)"; then
            if grep -Fxq "$IMAGE_TAG" <<< "$tags"; then echo 'Version already exists' >&2; exit 1; fi
          else
            grep -q '(HTTP 404)' /tmp/package-error || { cat /tmp/package-error; exit 1; }
          fi
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: .github/scripts/Containerfile
          load: true
          tags: |
            ghcr.io/safrano9999/duengerrechner:latest
            ghcr.io/safrano9999/duengerrechner:${{ inputs.image_tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/safrano9999/duengerrechner
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ inputs.image_tag }}
      - name: Container prüfen
        run: |
          docker run --pull never -d --name duenger-test -p 127.0.0.1:18080:8080 -p 127.0.0.1:18000:8000 -e API_BEARER_TOKEN=ci-api -e MCP_BEARER_TOKEN=ci-mcp ghcr.io/safrano9999/duengerrechner:latest
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:18080/health && curl --fail --silent http://127.0.0.1:18000/health; then break; fi
            sleep 1
          done
          API_BEARER_TOKEN=ci-api MCP_BEARER_TOKEN=ci-mcp MCP_URL=http://127.0.0.1:18000/mcp node scripts/smoke.mjs http://127.0.0.1:18080 --profiles
      - name: Image veröffentlichen
        run: |
          docker push ghcr.io/safrano9999/duengerrechner:latest
          docker push ghcr.io/safrano9999/duengerrechner:${{ inputs.image_tag }}
      - name: Container beenden
        if: always()
        run: docker logs duenger-test 2>/dev/null || true; docker rm -f duenger-test 2>/dev/null || true
